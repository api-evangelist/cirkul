aid: cirkul
name: Cirkul
description: 'Cirkul, Inc. is a Tampa, Florida direct-to-consumer beverage company
  founded in 2016 by Garrett Waggoner and Andy Gay. Cirkul sells a reusable bottle
  system paired with patented flavor cartridges — called Sips — that sit in the bottle
  lid behind a dial, letting a drinker adjust flavor intensity without pre-mixing.
  The cartridge lines include LifeSip, FitSip and GoSip, covering more than 100 zero-sugar,
  zero-calorie flavors spanning fruit blends, iced teas, iced coffees and caffeinated
  and electrolyte formulations. Cirkul does not publish a general-purpose developer
  API or an OpenAPI definition; its machine-readable surface is an agent-commerce one,
  served from its own drinkcirkul.com Shopify storefront: an anonymous Model Context
  Protocol server at /api/mcp, a Universal Commerce Protocol (UCP) merchant profile
  at /.well-known/ucp, a UCP shopping MCP endpoint at /api/ucp/mcp, published agent
  instructions at /agents.md and /llms.txt, and OAuth 2.0 / OpenID Connect discovery
  for the Shopify Customer Account API.'
