apis:
- aid: cirkul:storefront-agent-api
  name: Cirkul Storefront Agent API
  description: 'The agent-facing commerce surface Cirkul serves from its own drinkcirkul.com
    host. It comprises an anonymous Model Context Protocol (MCP) server at /api/mcp
    exposing five tools with real JSON Schema inputs (search_catalog, get_cart, update_cart,
    search_shop_policies_and_faqs, get_product_details), a Universal Commerce Protocol
    merchant discovery profile at /.well-known/ucp declaring cart, checkout, fulfillment,
    discount, order and catalog capabilities plus Shop Pay, Google Pay and card payment
    handlers, and a UCP shopping MCP endpoint at /api/ucp/mcp whose tools/list is gated
    behind a UCP agent-profile URI. Read-only catalog JSON (products.json, collection
    products.json) is documented for agents that only need to browse. Checkout explicitly
    requires contemporaneous human buyer approval.'
  humanURL: https://drinkcirkul.com/agents.md
